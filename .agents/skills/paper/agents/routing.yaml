# 这是请求偏好；实际宿主调用/配置是事实。脚本不调用模型。
schema_version: 3
allow_implicit_invocation: false
max_workers: 2 # workflow 单元 owner 上限
max_owner_units: 2
max_active_subagents: 3 # 项目偏好：根以外 owner+helper；运行时另核宿主全树及打开线程容量
max_depth: 2 # 项目约定根0/owner1/助手2，不是官方 agents.max_depth 配置
fork_history: none
script_dispatches_agents: false
profiles:
  read_owner_default: {model: gpt-6-sol, reasoning_effort: medium}
  locate: {model: gpt-6-luna, reasoning_effort: low}
  audit: {model: gpt-6-luna, reasoning_effort: medium}
  organize: {model: gpt-6-luna, reasoning_effort: high}
  explain: {model: gpt-6-sol, reasoning_effort: low}
  maintain: {model: gpt-6-sol, reasoning_effort: medium}
  compose: {model: gpt-6-sol, reasoning_effort: medium}
  bounded_compare: {model: gpt-6-sol, reasoning_effort: medium}
  deep_read: {model: gpt-6-sol, reasoning_effort: high}
  deep_compare: {model: gpt-6-sol, reasoning_effort: high}
  trace: {model: gpt-6-sol, reasoning_effort: high}
  critic: {model: gpt-6-sol, reasoning_effort: high}
task_routes:
  deterministic_parse_hash_links_arithmetic: script
  source_identity_bounded_lookup: locate
  bounded_numeric_source_check: audit
  first_pass_orientation: read_owner_default
  mechanism_learning_proof: read_owner_default
  alternatives_author_defense: read_owner_default
  conclusion_changing_mechanism_conflict: critic
  conclusion_changing_attribution_or_alternative: critic
  cross_paper_evolution_evidence: deep_compare
  knowledge_dedup: organize
  knowledge_semantic_revision: maintain
  controlled_composition: compose
dispatch:
  independent_multiple_papers: one_autonomous_owner_per_paper
  comparison_trace_knowledge: one_autonomous_owner_per_unit
  knowledge_owner_when: meaningful_increment_after_short_opportunity_impact_check
  initial_task_scope: entire_unit_goal_current_stage_resources
  parent_receives: final_report_or_actionable_exception
  parent_does_not_receive: intermediate_answers_evidence_coverage_logs
  unit_internal_checkpoints: true
  guidance_loads_current_stage_only: true
  helper_when: bounded_cross_tier_task_benefit_exceeds_full_tree_start_input_output_review_retry_wait_cost
  read_owner_default: medium_continuous_owner_with_quality_fallback
  low_tier_helper_when: bounded_source_or_numeric_check_cannot_be_cheaper_by_script_or_owner
  high_tier_helper_when: central_mechanism_conflict_or_unexcluded_attribution_or_decisive_alternative
  high_tier_helper_not_per_paper: true
  helper_return_requires: source_location_competing_explanations_distinguishing_observation_limits
  owner_verifies_decisive_helper_evidence: true
  helper_parent: owning_unit_owner
  helper_default_delegates: false
  helper_returns_to: owning_unit_owner_only
  helper_continuity: reuse_same_helper_for_related_same_tier_work
  replacement_requires_reason_and_handover: true
  main_fallback_requires_concrete_reason: true
  exceptions: [user_single_agent, delegation_prohibited, agent_tool_unavailable, quota_failure, dependency, disproportionate_handoff_cost]
  actual_fields: [observed, mode, agent_id, tool, call_id, actual_record, requested_model, requested_effort, actual_model, actual_effort]
rounds:
  read: [R1, R2a, R2b, R2c, R3a, R3b, R4]
  compare: [M1, M2, M3, M4]
  trace: [T0, T1, T2, T3, T4, T5, T6]
  knowledge: [K1, K2, K3, K4]
context:
  parent_bootstrap: task_dag_source_identity_constraints_final_targets
  owner_bootstrap: active_skill_unit_owner_contract_runtime_capabilities
  routing_load: when_model_or_helper_choice_needed
  later_stage: current_guide_new_source_windows_needed_interfaces
  batch_independent_source_windows_within_stage: true
  avoid_repeated_help_status_and_full_draft_reads: true
  one_short_delta_per_stage_not_parallel_long_reports: true
  composition_only: one_template_writing_obsidian_once
  packet_default: current_question_changed_constraints_unresolved_resource_refs_next_action
  scientific_carrier: one_unit_science_draft_plus_short_science_state
  checkpoint_carrier: immutable_script_generated_versions_not_stage_reports
  full_packet: explicit_audit_only
  do_not_load: [all_48_tasks, future_round_guides, full_parent_history, all_intermediate_rounds, full_manifest_text, maintenance_design]
  reread_only_for: [context_loss, changed_content_hash, targeted_correction, decisive_source_verification]
  bootstrap_tokens_soft_target: [800, 1200]
  later_packet_tokens_soft_target: [300, 600]
  helper_return_tokens_soft_target: [300, 600]
  token_metrics: actual_usage_only
  control_packet_proxy: explicit_characters_when_exact_tokenizer_unavailable
  source_budget: actual_scientific_need_not_instruction_target
  missing_token_telemetry: null
model_resolution:
  source_of_truth: runtime_tool_capabilities
  read_owner_profile: read_owner_default_unless_source_or_task_requires_high_at_start
  quality_fallback: raise_next_run_owner_or_targeted_helper_after_real_scientific_failure
  stage_route_is_preference_not_switch: true
  same_instance_switch_unsupported: bounded_helper_or_honest_same_model_fallback
  no_helper_for_each_leaf_or_trivial_stage: true
  root_model_is_not_changed_by_yaml: true
  unavailable_preference: map_by_capability_and_record_reason
  never_create_agents_to_evade_limits: true
concurrency:
  capacity_source: host_live_agent_tree
  count: root_plus_all_active_owners_and_helpers
  open_thread_count: separate_from_active_capacity
  reservation: reserve_actual_spawn_bind_complete_or_cancel
  current_host_snapshot_total: 4 # 本次接口事实，下一运行重新核对
  close_if_supported: true
  unavailable_close: report_open_capacity_not_fictitious_release
  no_helper_slot: owner_executes_or_waits
  independent_source_io: bounded_async_or_threads
  independent_pdf_parsing: bounded_process_pool_only_on_cache_miss
  workflow_updates: serialized_by_script_lock_unit_owned
  publication_index_common_knowledge: one_writer
review:
  intermediate: owner_source_check_or_bounded_local_review
  review_kinds: [self_check, independent_review, final_review]
  self_check_is_independent_review: false
  parent_review: final_candidate_decisive_source_windows_only
  read_scientific_gate: central_claim_has_reconstructable_mechanism_challenged_assumption_competing_explanation_or_distinguishing_test
  reject_paraphrase_without_new_inference: true
  publish_requires: accepted_science_boundaries_current_hashes_actual_final_review_unique_writer_mechanical_check_authorization
  unchanged_knowledge: concrete_reason_and_related_links_no_empty_candidate_or_review_agent
  ordinary_omission: same_owner_targeted_revision
  script_semantics: not_scientifically_verified
  default_user_interaction: complete_candidate_group
  guided_reading: interactive_pass_boundary_discussion
